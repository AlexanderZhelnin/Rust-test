cargo-features = ["profile-rustflags"]

[package]
name = "api_test"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
actix-web = "4.5"
serde_repr = "0.1"
futures = "0.3"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
itoa = "1.0.18"
tikv-jemallocator = "0.7.0"

[profile.release]
rustflags = ["-C", "target-cpu=native" ]
opt-level = 3
lto = true
codegen-units = 1
