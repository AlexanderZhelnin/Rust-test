[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[package]
name = "api_test"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
itoa = "1.0.18"
mimalloc = { version = "0.1.52", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "rc", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["float_roundtrip", "std"] }
serde_repr = "0.1.21"
tokio = { version = "1.53.1", default-features = false, features = ["fs", "macros", "net", "rt-multi-thread"] }
widestring = { version = "1.2.1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
