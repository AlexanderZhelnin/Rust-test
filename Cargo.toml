[package]
name = "api_test"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
actix-web = "4.5"
serde_repr = "0.1"
futures = "0.3"
tokio = { version = "1.37", features = ["rt-multi-thread", "macros"] }
itoa = "1.0.18"

[profile.release]
lto = "thin"
codegen-units=1
