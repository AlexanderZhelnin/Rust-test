[package]
name = "api_test"
version = "0.1.0"
edition = "2024"

[dependencies]
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
itoa = "1.0.18"
arrayvec = "0.7.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
